name: Build & Release MediaPipe (Raspberry Pi aarch64)

# Builds MediaPipe C++ artifacts for 64-bit Raspberry Pi OS and publishes them
# as a GitHub Release:
#   * mediapipe-<ver>-aarch64-rpi5.tar.gz - C++ shared library, headers, models,
#     graph configs and CPU example binaries.
#   * libmediapipe_<ver>-1_arm64.deb      - installer for a Raspberry Pi 5.
#
# Built natively on GitHub's free arm64 runners, inside a Debian container
# whose release matches the target Raspberry Pi OS (see DEBIAN_SUITE_DEFAULT).

on:
  # Manual builds: pick any MediaPipe tag.
  workflow_dispatch:
    inputs:
      mediapipe_version:
        description: "MediaPipe git tag to build (e.g. v0.10.35)"
        required: true
        default: "v0.10.35"
      release_tag:
        description: "Release tag to publish (defaults to the MediaPipe version)"
        required: false
        default: ""
      publish_release:
        description: "Publish a GitHub Release with the artifacts"
        type: boolean
        required: false
        default: true
      debian_suite:
        description: >-
          Debian release to build inside. MUST match the target Pi's OS: the
          library links that suite's OpenCV by soname, and a mismatch fails to
          load. Raspberry Pi OS for the Pi 5 is trixie.
        required: false
        default: "trixie"
  # Tag-driven builds: push a tag like mp-v0.10.35 to build that version.
  push:
    tags:
      - "mp-v*"
    # Bootstrap trigger: lets the pipeline run from its development branch
    # before it has been merged to the default branch (where workflow_dispatch
    # and tag triggers become available). Builds MEDIAPIPE_VERSION_DEFAULT below.
    branches:
      - "claude/mediapipe-rpi-release-pipeline-c8gd7g"
    paths:
      - ".github/workflows/release.yml"
      - "scripts/**"
      - "overlay/**"

env:
  # Version built when the pipeline runs from a branch push (bootstrap trigger).
  MEDIAPIPE_VERSION_DEFAULT: "v0.10.35"
  # Debian release the build container runs, and therefore the OpenCV the
  # shared library links by soname. This MUST match the target Pi's OS --
  # Raspberry Pi OS for the Pi 5 is Debian 13 (trixie), whose OpenCV is 4.10
  # (libopencv_core.so.410). Building on bookworm (OpenCV 4.6, .so.406)
  # produces a library that cannot load there at all.
  DEBIAN_SUITE_DEFAULT: "trixie"

permissions:
  contents: write

jobs:
  build:
    name: Build MediaPipe for aarch64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build parameters
        id: params
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            # tag mp-v0.10.35 -> MediaPipe v0.10.35
            MP_VER="${GITHUB_REF_NAME#mp-}"
            REL_TAG="${GITHUB_REF_NAME}"
            PUBLISH="true"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # Branch (bootstrap) push: build the default version.
            MP_VER="${MEDIAPIPE_VERSION_DEFAULT}"
            REL_TAG="mp-${MP_VER}"
            PUBLISH="true"
          else
            MP_VER="${{ github.event.inputs.mediapipe_version }}"
            REL_TAG="${{ github.event.inputs.release_tag }}"
            [ -n "$REL_TAG" ] || REL_TAG="mp-${MP_VER}"
            PUBLISH="${{ github.event.inputs.publish_release }}"
          fi
          SUITE="${{ github.event.inputs.debian_suite }}"
          [ -n "$SUITE" ] || SUITE="${DEBIAN_SUITE_DEFAULT}"
          echo "mediapipe_version=${MP_VER}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${REL_TAG}" >> "$GITHUB_OUTPUT"
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "debian_suite=${SUITE}" >> "$GITHUB_OUTPUT"
          echo "Building MediaPipe ${MP_VER} on debian:${SUITE} -> release ${REL_TAG} (publish=${PUBLISH})"

      - name: Free up disk & add swap
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          sudo mkdir -p /mnt
          # The ephemeral SSD at /mnt is large; use it for the Bazel cache.
          df -h
          if ! swapon --show | grep -q /mnt/swapfile; then
            sudo fallocate -l 10G /mnt/swapfile
            sudo chmod 600 /mnt/swapfile
            sudo mkswap /mnt/swapfile
            sudo swapon /mnt/swapfile
          fi
          free -h

      - name: Build MediaPipe in Debian ${{ steps.params.outputs.debian_suite }} (aarch64)
        run: |
          set -euxo pipefail
          sudo mkdir -p /mnt/mpbuild
          docker run --rm \
            -v "${GITHUB_WORKSPACE}":/workspace \
            -v /mnt/mpbuild:/mnt/mpbuild \
            -w /workspace \
            -e MEDIAPIPE_VERSION="${{ steps.params.outputs.mediapipe_version }}" \
            -e WORKSPACE_DIR=/workspace \
            -e BUILD_ROOT=/mnt/mpbuild \
            "debian:${{ steps.params.outputs.debian_suite }}" \
            bash scripts/build_mediapipe.sh

      - name: Package tarball & Debian installer
        run: |
          set -euxo pipefail
          sudo chown -R "$(id -u):$(id -g)" dist || true
          WORKSPACE_DIR="${GITHUB_WORKSPACE}" bash scripts/package_deb.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mediapipe-aarch64-${{ steps.params.outputs.mediapipe_version }}
          path: dist/artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: steps.params.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.params.outputs.release_tag }}
          name: MediaPipe ${{ steps.params.outputs.mediapipe_version }} for Raspberry Pi 5 (aarch64)
          body: |
            Prebuilt **MediaPipe ${{ steps.params.outputs.mediapipe_version }}** C++ artifacts for
            64-bit Raspberry Pi OS (aarch64), CPU/TFLite inference, GPU disabled. Built
            natively on arm64 inside a `debian:${{ steps.params.outputs.debian_suite }}`
            container, so it links that release's OpenCV **by soname** — install it on a
            matching Raspberry Pi OS or it will not load.

            Built for the **Raspberry Pi 5** (BCM2712, Cortex-A76) with
            `-mcpu=cortex-a76 -O3`. These binaries will **not** run on a Pi 4, Pi 3
            or Zero 2 W — those cores fault with `SIGILL`.

            ### Artifacts
            | File | Description |
            | ---- | ----------- |
            | `libmediapipe_*_arm64.deb` | Debian installer for Raspberry Pi 5. Installs to `/opt/mediapipe/<ver>`, registers `libmediapipe_tasks.so`, the example CPU binaries and `mediapipe.pc`. |
            | `mediapipe-*-aarch64-rpi5.tar.gz` | Same payload as a plain tarball: `lib/`, `bin/`, `include/`, `share/`. |

            ### Install on a Raspberry Pi 5 (64-bit Raspberry Pi OS)
            ```bash
            sudo apt-get update && sudo apt-get install -y libopencv-dev ffmpeg
            sudo dpkg -i libmediapipe_*_arm64.deb
            ```

            Contents: `libmediapipe_tasks.so` (Tasks Vision C++ API), MediaPipe headers,
            TFLite models, graph configs, the `face_landmarker.task` Tasks bundle,
            a `mediapipe.pc` for pkg-config, and CPU example binaries
            (`object_detection_cpu`, `face_detection_cpu`, `hand_tracking_cpu`,
            `pose_tracking_cpu`).

            Build against it with `pkg-config --cflags --libs mediapipe` (plus
            `-std=c++20`). Every release is gated on a self-check that compiles,
            links **and runs** a Face Landmarker program against only the packaged
            headers, library and model bundle.
          files: |
            dist/artifacts/*.deb
            dist/artifacts/*.tar.gz
          fail_on_unmatched_files: true
